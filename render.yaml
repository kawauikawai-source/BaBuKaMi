services:
  - type: web
    name: bambiku
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/requirements.txt && python scripts/build_render_site.py
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: BAMBIKU_ENV
        value: production
      - key: BAMBIKU_LOG_LEVEL
        value: INFO
      - key: BAMBIKU_LOG_FORMAT
        value: json
      - key: BAMBIKU_SECRET_KEY
        generateValue: true
      - key: BAMBIKU_DATABASE_URL
        sync: false
      - key: BAMBIKU_ADMIN_EMAILS
        sync: false
      - key: BAMBIKU_RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: BAMBIKU_SERVE_FRONTEND
        value: "true"
      - key: BAMBIKU_FRONTEND_DIST_DIR
        value: ../dist
      - key: BAMBIKU_REFRESH_COOKIE_SECURE
        value: "true"
      - key: BAMBIKU_REFRESH_COOKIE_SAMESITE
        value: lax
      - key: BAMBIKU_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: BAMBIKU_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BAMBIKU_BUKAMIKU_CLIENT_SECRET
        generateValue: true
      - key: BAMBIKU_BUKAMIKU_PUBLIC_URL
        fromService:
          type: web
          name: bukamiku
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: bukamiku
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn bukamiku_service.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: BUKAMIKU_CENTRAL_URL
        fromService:
          type: web
          name: bambiku
          envVarKey: RENDER_EXTERNAL_URL
      - key: BUKAMIKU_CLIENT_ID
        value: bukamiku-bank
      - key: BUKAMIKU_CLIENT_SECRET
        fromService:
          type: web
          name: bambiku
          envVarKey: BAMBIKU_BUKAMIKU_CLIENT_SECRET
      - key: BUKAMIKU_SESSION_SECRET
        generateValue: true
